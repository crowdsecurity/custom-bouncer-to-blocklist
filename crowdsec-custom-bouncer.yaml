# PArameters to change in your custom bouncer config on top of usuall parameters to ma ke it communicate with the LAPI
# Path to python from venv (3.11+)
bin_path: "<path to your python binary>"
# Path to the python script
bin_args: ["path to push2bl.py", "--blocklist", "ma_blocklist", "--sapi-key", "<your Service API Key>"]
# Invokes binary once and feeds incoming decisions to its stdin.
feed_via_stdin: true
# Number of times to restart the binary. relevant if feed_via_stdin=true. Set to -1 for infinite retries.
total_retries: 10
# Only pick up local & manual decisions
origins: ["crowdsec", "cscli"]